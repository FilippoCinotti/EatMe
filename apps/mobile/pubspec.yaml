name: eatme
description: EatMe — inventory, dietary preferences and cooking in one place.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: '>=3.0.0 <4.0.0'
  go_router: ^18.0.1
  crypto: ^3.0.7
  sign_in_with_apple: ^8.2.0
  dio: '>=5.7.0 <6.0.0'
  flutter_secure_storage: ^11.1.0
  supabase_flutter: '>=2.17.2 <3.0.0'
  flutter_local_notifications: ^22.3.0
  timezone: ">=0.10.0 <1.0.0"
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  qr_flutter: ^4.1.0
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.1
  url_launcher: ^6.3.2
  purchases_flutter: ^10.12.0
  uuid: ^4.5.1
  wakelock_plus: '>=1.2.0 <2.0.0'
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: '>=5.0.0 <7.0.0'
flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    - assets/images/
    - assets/brand/
    - assets/icons/
  fonts:
    - family: EatMeDisplay
      fonts:
        - asset: assets/fonts/EatMeDisplay-Regular.ttf
        - asset: assets/fonts/EatMeDisplay-Bold.ttf
          weight: 700
    - family: EatMeSans
      fonts:
        - asset: assets/fonts/EatMeSans-Regular.ttf
        - asset: assets/fonts/EatMeSans-Bold.ttf
          weight: 700
