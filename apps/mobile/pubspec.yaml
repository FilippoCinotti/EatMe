name: eatme
description: EatMe — inventory, dietary preferences and cooking in one place.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: '>=3.0.0 <4.0.0'
  go_router: ^18.0.1
  dio: '>=5.7.0 <6.0.0'
  flutter_secure_storage: ^11.1.0
  supabase_flutter: '>=2.8.0 <3.0.0'
  uuid: ^4.5.1
  wakelock_plus: '>=1.2.0 <2.0.0'
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: '>=5.0.0 <7.0.0'
flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
