[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eatme-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "PyJWT[crypto]>=2.9,<3", "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]

[tool.setuptools.package-data]
eatme = ["schema.sql"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
