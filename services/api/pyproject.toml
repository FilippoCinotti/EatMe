[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eatme-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1,<1", "uvicorn[standard]>=0.53.0,<1",
  "Pillow>=11.3,<13", "cryptography>=50.0.0,<51",
  "PyJWT[crypto]>=2.9,<3", "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
dev = ["httpx>=0.28.1,<1", "ruff>=0.16.7,<1", "pip-audit>=2.10.1,<3"]

[tool.setuptools.package-data]
eatme = ["schema.sql", "domain.sql"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
