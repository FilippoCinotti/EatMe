# Supply .env.production from a secret manager. Terminate HTTPS at your gateway.
services:
  api:
    image: ${EATME_IMAGE:?Set an immutable image digest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      EATME_ENV: production
      AUTH_MODE: supabase
      MEDIA_STORAGE_BACKEND: supabase
    ports: ["127.0.0.1:8000:8000"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  worker:
    image: ${EATME_IMAGE:?Set an immutable image digest}
    command: ["python", "-m", "eatme.worker"]
    restart: unless-stopped
    env_file: .env.production
    environment:
      EATME_ENV: production
      AUTH_MODE: supabase
      MEDIA_STORAGE_BACKEND: supabase
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  guest:
    image: ${EATME_GUEST_IMAGE:?Set an immutable guest image digest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?Set the public API URL}
    ports: ["127.0.0.1:3000:3000"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 6s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
