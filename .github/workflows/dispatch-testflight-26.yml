name: One-time TestFlight build 26 dispatcher
on:
  push:
    branches:
      - release/dispatch-testflight-26
    paths:
      - .github/workflows/dispatch-testflight-26.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official TestFlight workflow for reviewed main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run testflight.yml --repo "$GH_REPO" --ref main \
            -f release_sha=45148031776485235b9a1ccc44b6eb0aacbc372a \
            -f build_number=26 \
            -f upload_to_testflight=true
