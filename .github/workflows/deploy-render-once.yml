name: Deploy EatMe API and worker to Render

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-render-once.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      TARGET_COMMIT: c44ced4bf2201e7c8d774fa949480afd4ddd7a02
    steps:
      - name: Validate Render credentials
        run: |
          test -n "$RENDER_API_KEY" || { echo "Missing RENDER_API_KEY repository secret"; exit 1; }

      - name: Resolve production services and trigger deploys
        run: |
          set -euo pipefail
          services=$(curl --fail --silent --show-error \
            --header "Accept: application/json" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services?limit=100")

          api_id=$(printf '%s' "$services" | jq -r '.[] | select(.service.name=="eatme-api") | .service.id' | head -n1)
          worker_id=$(printf '%s' "$services" | jq -r '.[] | select(.service.name=="eatme-worker") | .service.id' | head -n1)

          test -n "$api_id" || { echo "eatme-api service not found"; exit 1; }
          test -n "$worker_id" || { echo "eatme-worker service not found"; exit 1; }

          api_deploy=$(curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --data "{\"commitId\":\"$TARGET_COMMIT\",\"clearCache\":\"do_not_clear\"}" \
            "https://api.render.com/v1/services/$api_id/deploys")
          worker_deploy=$(curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --data "{\"commitId\":\"$TARGET_COMMIT\",\"clearCache\":\"do_not_clear\"}" \
            "https://api.render.com/v1/services/$worker_id/deploys")

          api_deploy_id=$(printf '%s' "$api_deploy" | jq -r '.id')
          worker_deploy_id=$(printf '%s' "$worker_deploy" | jq -r '.id')
          test -n "$api_deploy_id"
          test -n "$worker_deploy_id"

          echo "API_SERVICE_ID=$api_id" >> "$GITHUB_ENV"
          echo "WORKER_SERVICE_ID=$worker_id" >> "$GITHUB_ENV"
          echo "API_DEPLOY_ID=$api_deploy_id" >> "$GITHUB_ENV"
          echo "WORKER_DEPLOY_ID=$worker_deploy_id" >> "$GITHUB_ENV"
          echo "Triggered eatme-api and eatme-worker for commit $TARGET_COMMIT"

      - name: Wait for both Render deploys
        run: |
          set -euo pipefail
          wait_for_deploy() {
            local service_id="$1"
            local deploy_id="$2"
            local label="$3"
            for attempt in $(seq 1 60); do
              response=$(curl --fail --silent --show-error \
                --header "Accept: application/json" \
                --header "Authorization: Bearer $RENDER_API_KEY" \
                "https://api.render.com/v1/services/$service_id/deploys/$deploy_id")
              status=$(printf '%s' "$response" | jq -r '.status')
              echo "$label status: $status"
              case "$status" in
                live) return 0 ;;
                build_failed|update_failed|canceled|deactivated) return 1 ;;
              esac
              sleep 10
            done
            echo "$label deployment timed out"
            return 1
          }

          wait_for_deploy "$API_SERVICE_ID" "$API_DEPLOY_ID" "eatme-api" &
          api_pid=$!
          wait_for_deploy "$WORKER_SERVICE_ID" "$WORKER_DEPLOY_ID" "eatme-worker" &
          worker_pid=$!

          api_rc=0
          worker_rc=0
          wait "$api_pid" || api_rc=$?
          wait "$worker_pid" || worker_rc=$?
          test "$api_rc" -eq 0
          test "$worker_rc" -eq 0

      - name: Verify production API health
        run: |
          curl --fail --silent --show-error --max-time 20 \
            https://api.eatmeapplication.com/api/v1/health
