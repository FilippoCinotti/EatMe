name: Verify Render deployment once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-render-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for production API commit
        env:
          EXPECTED_MARKER: build8-20260924
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            body=$(curl --fail --silent --show-error --max-time 20 https://api.eatmeapplication.com/api/v1/health || true)
            echo "health: $body"
            marker=$(printf '%s' "$body" | jq -r '.deploy_marker // empty' 2>/dev/null || true)
            if [ "$marker" = "$EXPECTED_MARKER" ]; then
              echo "Render production API is live with marker $EXPECTED_MARKER"
              exit 0
            fi
            sleep 10
          done
          echo "Render production API did not reach expected marker $EXPECTED_MARKER"
          exit 1
