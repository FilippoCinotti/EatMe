name: Nutrition seed refresh

on:
  push:
    branches:
      - feat/canonical-nutrition-data
    paths:
      - data/nutrition/usda_reviewed_mappings.json
      - scripts/build_usda_nutrition_seed.py
      - .github/workflows/nutrition-seed.yml

permissions:
  contents: write

jobs:
  build-seed:
    if: "!contains(github.event.head_commit.message, 'chore(nutrition): refresh reviewed USDA seed')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/canonical-nutrition-data
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build source-backed nutrition seed
        run: python scripts/build_usda_nutrition_seed.py
      - name: Commit generated nutrition seed
        run: |
          if [ -z "$(git status --porcelain -- data/nutrition/usda_nutrition.generated.json supabase/migrations/202609230010_usda_nutrition.sql)" ]; then
            echo "No seed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nutrition/usda_nutrition.generated.json supabase/migrations/202609230010_usda_nutrition.sql
          git commit -m "chore(nutrition): refresh reviewed USDA seed"
          git pull --rebase origin feat/canonical-nutrition-data
          git push origin HEAD:feat/canonical-nutrition-data
