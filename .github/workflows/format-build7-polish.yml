name: One-shot format build 7 polish

on:
  push:
    branches:
      - fix/build7-diets-avatar
    paths:
      - .github/workflows/format-build7-polish.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/build7-diets-avatar
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Format changed Dart sources
        run: |
          dart format \
            apps/mobile/lib/design_system/theme.dart \
            apps/mobile/lib/features/chef_table/chef_table.dart \
            apps/mobile/lib/features/organize/scanning.dart \
            apps/mobile/lib/features/profile/diet_health.dart \
            apps/mobile/lib/features/recipe/recipe.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet -- apps/mobile/lib; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib
          git commit -m "style: apply Dart 3.13.2 formatter"
          git push origin HEAD:fix/build7-diets-avatar
