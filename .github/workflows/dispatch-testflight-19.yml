name: Dispatch TestFlight build 19 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-testflight-19.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch reviewed TestFlight release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run testflight.yml --repo FilippoCinotti/EatMe --ref main \
            -f release_sha=e4982d0cf2131755ebbdb0451168962b83ffa1a6 \
            -f build_number=19 \
            -f upload_to_testflight=true
