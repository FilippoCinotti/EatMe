name: Dispatch TestFlight build 10

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-testflight-build-10.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch reviewed main commit to TestFlight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 7f5a89c2eb75175463d7c0b3cc3ed8f8197ecaae
        run: |
          test -n "$RELEASE_SHA"
          test "$RELEASE_SHA" != "0000000000000000000000000000000000000000"
          gh workflow run testflight.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_sha="$RELEASE_SHA" \
            -f build_number=10 \
            -f upload_to_testflight=true
