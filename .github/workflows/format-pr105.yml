name: Format PR 105 Dart sources (one-off)

on:
  push:
    branches:
      - fix/network-resilience-offline-startup

permissions:
  contents: write

concurrency:
  group: format-pr105-dart
  cancel-in-progress: false

jobs:
  format-pr:
    if: github.repository == 'FilippoCinotti/EatMe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/network-resilience-offline-startup
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Format Dart sources and commit only formatting
        shell: bash
        run: |
          set -euo pipefail
          dart format apps/mobile/lib apps/mobile/test apps/mobile/integration_test
          git add apps/mobile/lib apps/mobile/test apps/mobile/integration_test
          if git diff --cached --quiet; then
            echo "Sources are already formatted"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(mobile): apply Dart formatter to PR 105'
          git push origin HEAD:fix/network-resilience-offline-startup
