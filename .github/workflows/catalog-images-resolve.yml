name: Resolve catalog ingredient images

on:
  push:
    branches:
      - fix/catalog-images
    paths:
      - scripts/catalog_image_targets.json
      - scripts/resolve_catalog_images.py
      - .github/workflows/catalog-images-resolve.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Resolve CC0 ingredient images
        run: python3 scripts/resolve_catalog_images.py
      - name: Commit resolved mapping
        run: |
          if [ -z "$(git status --porcelain -- generated/catalog_image_map.json)" ]; then
            echo "No mapping changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/catalog_image_map.json
          git commit -m "chore(media): resolve CC0 catalog image mapping"
          git push origin HEAD:fix/catalog-images
