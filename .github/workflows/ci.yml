name: EatMe CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: eatme-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install -e 'services/api[dev]'
      - run: python -m unittest discover -s services/api/tests -v
      - run: python -m ruff check services/api services/worker scripts
      - run: python scripts/check_repository.py
      - run: python -m pip_audit
      - run: docker build -t eatme-api:ci services/api
  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ephemeral-ci-password
          POSTGRES_DB: eatme_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ephemeral-ci-password
      PGDATABASE: eatme_test
    steps:
      - uses: actions/checkout@v7
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap_ci.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202609100001_core.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202609100002_rls.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202609110003_domains.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202609110004_identity.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202609170005_dinners.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202609190006_security_hardening.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202609230001_builtin_diet_profiles.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls.sql
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install -e services/api
      - run: python -m unittest discover -s services/api/tests -p test_postgres.py -v
        env:
          EATME_TEST_POSTGRES: postgresql://postgres:ephemeral-ci-password@localhost:5432/eatme_test
  mobile:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, macos-latest]}
    steps:
      - uses: actions/checkout@v7
      - name: Reserve space for Android builds and emulator
        if: runner.os == 'Linux'
        run: |
          # This disposable mobile runner does not use these preinstalled SDKs.
          sudo rm -rf -- /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h /
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/mobile/android/**/*.gradle*
            apps/mobile/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: '3.47.2', cache: true}
      - run: python3 scripts/bootstrap_mobile.py
      - name: Format Dart sources
        run: dart format lib test integration_test
        working-directory: apps/mobile
      - name: Export generated sources
        if: always()
        run: python3 scripts/export_mobile_ci.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-sources-${{ runner.os }}
          path: mobile-sources.zip
          retention-days: 7
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - name: Validate localization and screenshot route policy
        if: runner.os == 'Linux'
        run: |
          python3 scripts/check_localizations.py apps/mobile/assets/l10n
          python3 scripts/check_screenshot_coverage.py --routes-only
      - if: runner.os == 'Linux'
        run: flutter build apk --debug
        timeout-minutes: 20
        working-directory: apps/mobile
      - if: runner.os == 'macOS'
        run: flutter build ios --simulator --debug
        working-directory: apps/mobile
      - name: Archive iOS simulator application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/EatMe-iOS-Simulator.zip
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: EatMe-Android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: EatMe-iOS-simulator
          path: apps/mobile/build/EatMe-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
      - name: Prepare Android integration backend
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install -e services/api
          uvicorn eatme.api:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log > /tmp/eatme-test-api.log 2>&1 &
          sudo chmod 666 /dev/kvm
      - name: Android application integration
        if: runner.os == 'Linux'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          working-directory: apps/mobile
          script: flutter test integration_test/kitchen_flow_test.dart --dart-define=API_URL=http://10.0.2.2:8000/api/v1
      - name: Verify Dart formatting
        run: git diff --exit-code -- lib test integration_test
        working-directory: apps/mobile
      - name: Export UI verification images
        if: always()
        run: python3 scripts/export_ci_review.py mobile
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: interface-review-${{ runner.os }}
          path: apps/mobile/build/screenshots/*.png
          retention-days: 14
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
        working-directory: apps/admin
      - run: python3 scripts/export_ci_review.py admin
      - run: npm run typecheck
        working-directory: apps/admin
      - run: npm run build
        working-directory: apps/admin
      - run: npm audit --omit=dev
        working-directory: apps/admin
      - run: docker build -t eatme-admin:ci .
        working-directory: apps/admin
  public:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/public/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev
      - run: docker build -t eatme-public:ci .
  guest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/guest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/guest/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.eatme.invalid/api/v1
      - name: Capture deterministic Guest Web baseline
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
          npx playwright install chromium
          SCREENSHOT_MODE=1 PORT=3000 npm start -- --hostname 127.0.0.1 > "$RUNNER_TEMP/guest.log" 2>&1 &
          guest_pid=$!
          trap 'kill "$guest_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/screenshot-fixture/landing?locale=en >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then cat "$RUNNER_TEMP/guest.log"; exit 1; fi
            sleep 1
          done
          npm run screenshots
        env:
          SCREENSHOT_BASE_URL: http://127.0.0.1:3000
      - name: Upload Guest Web screenshot evidence
        uses: actions/upload-artifact@v7
        with:
          name: guest-web-screenshot-baseline
          path: |
            docs/screenshots/guest
            docs/screenshots/localization
          if-no-files-found: error
          retention-days: 14
      - run: npm audit --omit=dev
      - run: docker build --build-arg NEXT_PUBLIC_API_URL=https://api.eatme.invalid/api/v1 -t eatme-guest:ci .
