name: EatMe CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: eatme-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e 'services/api[dev]'
      - run: python -m unittest discover -s services/api/tests -v
      - run: python -m ruff check services/api services/worker scripts
      - run: python scripts/check_repository.py
      - run: python -m pip_audit
      - run: docker build -t eatme-api:ci services/api
  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ephemeral-ci-password
          POSTGRES_DB: eatme_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ephemeral-ci-password
      PGDATABASE: eatme_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap_ci.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202609100001_core.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202609100002_rls.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls.sql
  mobile:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: {os: [ubuntu-latest, macos-latest]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: '3.47.2', cache: true}
      - run: python3 scripts/bootstrap_mobile.py
      - name: Verify Dart formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - if: runner.os == 'Linux'
        run: flutter build apk --debug
        working-directory: apps/mobile
      - if: runner.os == 'macOS'
        run: flutter build ios --simulator --debug
        working-directory: apps/mobile
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --ignore-scripts
        working-directory: apps/admin
      - run: npm run typecheck
        working-directory: apps/admin
      - run: npm run build
        working-directory: apps/admin
      - run: npm audit --omit=dev
        working-directory: apps/admin
