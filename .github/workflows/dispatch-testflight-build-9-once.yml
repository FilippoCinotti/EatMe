name: Dispatch TestFlight build 9 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-testflight-build-9-once.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: startsWith(github.event.head_commit.message, 'chore: dispatch TestFlight build 9')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch protected TestFlight workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run testflight.yml \
            --repo FilippoCinotti/EatMe \
            --ref main \
            -f release_sha=38df3d8f06242627c2d251f59ae12f25143f4c9e \
            -f build_number=9 \
            -f upload_to_testflight=true
