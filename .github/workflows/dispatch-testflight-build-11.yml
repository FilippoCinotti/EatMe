name: Cancel duplicate TestFlight build 11

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-testflight-build-11.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only the duplicate queued upload
        env:
          GH_TOKEN: ${{ github.token }}
          DUPLICATE_RUN: '36482093648'
        run: |
          run_status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DUPLICATE_RUN" --jq .status)
          if [ "$run_status" != "completed" ]; then
            if ! gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$DUPLICATE_RUN/cancel"; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DUPLICATE_RUN" --jq .status)" = "completed"
            fi
          fi
